name: Deploy production

on:
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: deploy
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_SCRIPT_PATH: ${{ vars.DEPLOY_SCRIPT_PATH }}
      DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      DEPLOY_IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - name: Check deploy configuration
        run: |
          set -euo pipefail

          missing=0
          for name in \
            DEPLOY_HOST \
            DEPLOY_USER \
            DEPLOY_SSH_KEY_B64 \
            DEPLOY_SSH_KNOWN_HOSTS
          do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: ${name}" >&2
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Configure SSH
        run: |
          set -euo pipefail

          install -d -m 700 "$HOME/.ssh"
          printf '%s' "$DEPLOY_SSH_KEY_B64" | base64 -d > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy over SSH
        run: |
          set -euo pipefail

          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          DEPLOY_SCRIPT_PATH="${DEPLOY_SCRIPT_PATH:-/usr/local/sbin/deploy-crm}"

          ssh -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -se -- \
            "$DEPLOY_SCRIPT_PATH" \
            "$DEPLOY_IMAGE_TAG" <<'REMOTE'
          set -euo pipefail

          DEPLOY_SCRIPT_PATH="$1"
          DEPLOY_IMAGE_TAG="$2"

          sudo "$DEPLOY_SCRIPT_PATH" "$DEPLOY_IMAGE_TAG"
          REMOTE
