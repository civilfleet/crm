name: Docker Image

on:
  push:
    branches:
      - main
      - docker-compose
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run tests and typecheck
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false
          load: true
          tags: crm-ci-test:${{ github.sha }}
          cache-from: type=gha,scope=ci-test
          cache-to: type=gha,mode=max,scope=ci-test

      # Build a fresh database from the migrations, fail on any drift from
      # prisma/schema.prisma, then run the database tests (tests/db).
      - name: Check migrations and run database tests
        run: |
          set -euo pipefail
          docker network create crm-ci >/dev/null
          docker run -d --rm --name crm-ci-db --network crm-ci \
            -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=crm_test \
            postgres:16-alpine >/dev/null
          for _ in $(seq 1 60); do
            docker exec crm-ci-db pg_isready -U postgres -d crm_test >/dev/null 2>&1 && break
            sleep 1
          done
          docker run --rm --network crm-ci \
            -e TEST_DATABASE_URL="postgresql://postgres:ci@crm-ci-db:5432/crm_test" \
            "crm-ci-test:${{ github.sha }}" \
            yarn ci:db

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
