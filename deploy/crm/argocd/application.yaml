apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crm
  namespace: argocd
spec:
  project: crm
  destination:
    name: in-cluster
    namespace: crm
  source:
    repoURL: gitea@git.sea.watch:IT-Department/crm.git
    targetRevision: main
    path: deploy/crm/kubernetes
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - PruneLast=true
