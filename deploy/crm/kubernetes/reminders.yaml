apiVersion: batch/v1
kind: CronJob
metadata:
  name: crm-reminders
  namespace: crm
spec:
  schedule: 0 23 * * *
  timeZone: Etc/UTC
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: crm
            app.kubernetes.io/component: reminders
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: reminders
            image: git.sea.watch/it-department/crm:bootstrap-required
            command:
            - node
            - -e
            - fetch('http://crm-web:3000/api/cron/reminders',{headers:{Authorization:'Bearer '+process.env.CRON_SECRET},signal:AbortSignal.timeout(240000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            env:
            - name: CRON_SECRET
              valueFrom:
                secretKeyRef:
                  name: crm-reminder-auth
                  key: CRON_SECRET
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 250m
                memory: 128Mi
          imagePullSecrets:
          - name: gitea-registry
          restartPolicy: Never
