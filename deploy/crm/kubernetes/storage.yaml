apiVersion: v1
kind: Service
metadata:
  name: crm-storage
  namespace: crm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/part-of: crm
    app.kubernetes.io/component: storage
  ports:
  - name: s3
    port: 8333
    targetPort: s3
---
apiVersion: v1
kind: Service
metadata:
  name: crm-storage-headless
  namespace: crm
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/part-of: crm
    app.kubernetes.io/component: storage
  ports:
  - name: s3
    port: 8333
    targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: crm-storage
  namespace: crm
spec:
  serviceName: crm-storage-headless
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/part-of: crm
      app.kubernetes.io/component: storage
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: crm
        app.kubernetes.io/component: storage
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: storage
        image: chrislusf/seaweedfs:4.50@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860
        args:
        - server
        - -dir=/data/volume
        - -master.dir=/data/master
        - -master.volumeSizeLimitMB=1024
        - -volume.max=0
        - -master.telemetry=false
        - -ip=$(POD_NAME).crm-storage-headless.$(POD_NAMESPACE).svc.cluster.local
        - '-ip.bind=::'
        - -s3
        - -s3.config=/etc/crm-storage/s3.json
        - -s3.iam=false
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        workingDir: /data
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - name: s3
          containerPort: 8333
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        volumeMounts:
        - name: data
          mountPath: /data
        - name: config
          mountPath: /etc/seaweedfs
        - name: auth
          mountPath: /etc/crm-storage
          readOnly: true
        - name: tmp
          mountPath: /tmp
        startupProbe:
          tcpSocket:
            port: s3
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          tcpSocket:
            port: s3
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: s3
          periodSeconds: 30
          failureThreshold: 5
      initContainers:
      - name: prepare-directories
        image: chrislusf/seaweedfs:4.50@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860
        command:
        - /bin/sh
        - -ec
        - mkdir -p /data/volume /data/master /data/filer
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /data
      terminationGracePeriodSeconds: 120
      volumes:
      - name: config
        configMap:
          name: crm-storage-config
      - name: auth
        secret:
          secretName: crm-storage-auth
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
  volumeClaimTemplates:
  - metadata:
      name: data
      annotations:
        argocd.argoproj.io/sync-options: Prune=false,Delete=false
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: ceph-rbd
      resources:
        requests:
          storage: 100Gi
