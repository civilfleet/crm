apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-worker
  namespace: crm
spec:
  replicas: 0
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/part-of: crm
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: crm
        app.kubernetes.io/component: worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        image: git.sea.watch/it-department/crm-tools:bootstrap-required
        command:
        - node
        - --import
        - tsx
        - scripts/background-worker.ts
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        envFrom:
        - configMapRef:
            name: crm-config
        - secretRef:
            name: crm-runtime
        env:
        - name: BACKGROUND_WORKER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: HOME
          value: /tmp
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        startupProbe:
          exec:
            command:
            - node
            - --import
            - tsx
            - scripts/check-background-worker-health.ts
          periodSeconds: 15
          timeoutSeconds: 15
          failureThreshold: 24
        readinessProbe:
          exec:
            command:
            - node
            - --import
            - tsx
            - scripts/check-background-worker-health.ts
          periodSeconds: 60
          timeoutSeconds: 15
      imagePullSecrets:
      - name: gitea-registry
      terminationGracePeriodSeconds: 120
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 512Mi
