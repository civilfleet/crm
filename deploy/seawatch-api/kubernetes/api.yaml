apiVersion: apps/v1
kind: Deployment
metadata:
  name: seawatch-api
  namespace: seawatch-api
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: seawatch-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: seawatch-api }
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{ name: gitea-registry }]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          # Replaced by the image workflow before Argo CD is bootstrapped.
          image: git.sea.watch/it-department/seawatch-api@sha256:883f18f8e7980174fc095979036123df45d54e008ad69776dec104b17aab2d90
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            - { name: NATS_URL, value: "nats://jetstream:4222" }
            - { name: NATS_USER, value: api }
            - name: NATS_PASSWORD
              valueFrom: { secretKeyRef: { name: seawatch-api-env, key: API_NATS_PASSWORD } }
            - name: RATE_LIMIT_HASH_KEY
              valueFrom: { secretKeyRef: { name: seawatch-api-env, key: RATE_LIMIT_HASH_KEY } }
            # Signs e-mail confirmation links; the CRM holds the same key.
            # Optional: without it the confirmation route answers 503.
            - name: FORM_CONFIRMATION_KEY
              valueFrom: { secretKeyRef: { name: seawatch-api-env, key: FORM_CONFIRMATION_KEY, optional: true } }
            # Captcha per intake route: off, optional (checked when sent) or
            # required. Switch to required once that website form sends it.
            # Forms: required, the website sends it (sea-watch-nuxt #631).
            - name: CAPTCHA_MODE_FORMS
              value: "required"
            - name: CAPTCHA_MODE_EVENTS
              value: "off"
            - name: CAPTCHA_KEY
              valueFrom: { secretKeyRef: { name: seawatch-api-env, key: CAPTCHA_KEY, optional: true } }
            # Exact origins only. www redirects to sea-watch.org; other preview aliases remain denied.
            - name: PUBLIC_EVENTS_ORIGINS
              value: "https://seawatch-events.netlify.app,https://sea-watch.org,https://dev-bridge-integration--seawatch.netlify.app,https://staging--seawatch.netlify.app"
          ports: [{ name: http, containerPort: 8080 }]
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata: { name: seawatch-api, namespace: seawatch-api }
spec:
  selector: { app.kubernetes.io/name: seawatch-api }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: initialize-event-streams
  namespace: seawatch-api
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      imagePullSecrets: [{ name: gitea-registry }]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: initialize
          image: git.sea.watch/it-department/seawatch-api@sha256:883f18f8e7980174fc095979036123df45d54e008ad69776dec104b17aab2d90
          args: ["--initialize"]
          command: [node, server.cjs]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            - { name: NATS_URL, value: "nats://jetstream:4222" }
            - { name: NATS_USER, value: bootstrap }
            - name: NATS_PASSWORD
              valueFrom: { secretKeyRef: { name: seawatch-api-env, key: BOOTSTRAP_NATS_PASSWORD } }
