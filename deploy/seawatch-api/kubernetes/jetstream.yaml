apiVersion: v1
kind: ConfigMap
metadata: { name: jetstream-config, namespace: seawatch-api }
data:
  nats.conf: |
    port: 4222
    http_port: 8222
    server_name: seawatch-api-jetstream
    jetstream {
      store_dir: /data/jetstream
      max_file_store: 4GB
      max_memory_store: 64MB
    }
    websocket {
      port: 8080
      no_tls: true
      compression: true
    }
    include auth/authorization.conf
---
apiVersion: v1
kind: Service
metadata: { name: jetstream, namespace: seawatch-api }
spec:
  selector: { app.kubernetes.io/name: seawatch-jetstream }
  ports:
    - { name: nats, port: 4222, targetPort: nats }
    - { name: websocket, port: 8080, targetPort: websocket }
    - { name: monitoring, port: 8222, targetPort: monitoring }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: jetstream, namespace: seawatch-api }
spec:
  serviceName: jetstream
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: seawatch-jetstream }
  template:
    metadata:
      labels: { app.kubernetes.io/name: seawatch-jetstream }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nats
          image: nats:2.12.1-alpine@sha256:b3f2bd84176ae7bd0afa9c48a00f06d7d0818ff4aaee898e4172e0b8340e5816
          args: ["--config", "/etc/nats/nats.conf"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          ports:
            - { name: nats, containerPort: 4222 }
            - { name: websocket, containerPort: 8080 }
            - { name: monitoring, containerPort: 8222 }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: config, mountPath: /etc/nats, readOnly: true }
            - { name: auth, mountPath: /etc/nats/auth, readOnly: true }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          startupProbe: { httpGet: { path: /healthz, port: monitoring }, failureThreshold: 30, periodSeconds: 5 }
          readinessProbe: { httpGet: { path: "/healthz?js-enabled-only=true", port: monitoring }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: monitoring }, periodSeconds: 20 }
      volumes:
        - { name: config, configMap: { name: jetstream-config } }
        - { name: auth, secret: { secretName: seawatch-nats-auth } }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: ceph-rbd
        resources:
          requests: { storage: 10Gi }
