apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: api-ingress, namespace: seawatch-api }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: seawatch-api } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: traefik } }
          podSelector: { matchLabels: { app.kubernetes.io/name: traefik } }
      ports: [{ protocol: TCP, port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: broker-ingress, namespace: seawatch-api }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: seawatch-jetstream } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: seawatch-api } }
        - podSelector: { matchLabels: { job-name: initialize-event-streams } }
      ports: [{ protocol: TCP, port: 4222 }]
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: traefik } }
          podSelector: { matchLabels: { app.kubernetes.io/name: traefik } }
      ports: [{ protocol: TCP, port: 8080 }]
