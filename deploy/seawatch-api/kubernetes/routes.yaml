# This API is explicitly public. The broker uses the private gateway only.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: { name: seawatch-api-public, namespace: seawatch-api }
spec:
  secretName: seawatch-api-public-tls
  dnsNames: [api.sea.watch]
  issuerRef: { name: letsencrypt-production, kind: ClusterIssuer }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: seawatch-api-public
  namespace: seawatch-api
  annotations:
    external-dns.alpha.kubernetes.io/target: traefik.sea.watch
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`api.sea.watch`) && PathPrefix(`/v1/`)
      services: [{ name: seawatch-api, port: http }]
  tls: { secretName: seawatch-api-public-tls }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: { name: seawatch-api-broker, namespace: seawatch-api }
spec:
  entryPoints: [vpnwebsecure]
  routes:
    - kind: Rule
      match: Host(`seawatch-api.k8s-vpn.sea.watch`)
      services: [{ name: jetstream, port: websocket }]
  tls: {}
