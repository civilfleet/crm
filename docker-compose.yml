x-database-env: &database-env
  DATABASE_URL: ${DATABASE_URL:-postgresql://crm:crm@${SERVICE_NAME_POSTGRES:-postgres}:5432/crm}

x-storage-env: &storage-env
  NEXT_AWS_S3_ACCESS_KEY: ${NEXT_AWS_S3_ACCESS_KEY:-local}
  NEXT_AWS_S3_ACCESS_SECRET: ${NEXT_AWS_S3_ACCESS_SECRET:-local-secret}
  NEXT_AWS_S3_BUCKET_NAME: ${NEXT_AWS_S3_BUCKET_NAME:-crm}
  NEXT_AWS_S3_BUCKET_REGION: ${NEXT_AWS_S3_BUCKET_REGION:-us-east-1}
  NEXT_AWS_S3_ENDPOINT: ${NEXT_AWS_S3_ENDPOINT:-http://${SERVICE_NAME_SEAWEEDFS:-seaweedfs}:8333}

x-bootstrap-env: &bootstrap-env
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
  BOOTSTRAP_ADMIN_EMAILS: ${BOOTSTRAP_ADMIN_EMAILS:-}
  BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Local Admin}

services:
  seaweedfs:
    image: crm-seaweedfs:local
    build:
      context: .
      target: runner-seaweedfs
    command: [ "server", "-dir=/data", "-s3", "-s3.config=/etc/seaweedfs/s3.json" ]
    volumes:
      - seaweedfs-data:/data

  seaweedfs-init:
    image: amazon/aws-cli:latest
    restart: "no"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until aws --endpoint-url="$${SEAWEEDFS_ENDPOINT}" s3api list-buckets >/dev/null 2>&1; do
          sleep 1
        done
        aws --endpoint-url="$${SEAWEEDFS_ENDPOINT}" s3api head-bucket --bucket "$${NEXT_AWS_S3_BUCKET_NAME}" >/dev/null 2>&1 || aws --endpoint-url="$${SEAWEEDFS_ENDPOINT}" s3api create-bucket --bucket "$${NEXT_AWS_S3_BUCKET_NAME}"
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local-secret
      AWS_DEFAULT_REGION: us-east-1
      SEAWEEDFS_ENDPOINT: http://${SERVICE_NAME_SEAWEEDFS:-seaweedfs}:8333
      NEXT_AWS_S3_BUCKET_NAME: ${SEAWEEDFS_BUCKET_NAME:-crm}
    depends_on:
      - seaweedfs

  seaweedfs-cors:
    image: crm-tools:local
    restart: "no"
    build:
      context: .
      target: runner-tools
    command: [ "node", "--import", "tsx", "scripts/manage-s3-cors.ts", "apply" ]
    environment:
      <<: *storage-env
      S3_CORS_ALLOWED_ORIGINS: ${S3_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      S3_CORS_ALLOWED_METHODS: ${S3_CORS_ALLOWED_METHODS:-GET,HEAD,PUT}
      S3_CORS_ALLOWED_HEADERS: "${S3_CORS_ALLOWED_HEADERS:-*}"
      S3_CORS_EXPOSE_HEADERS: ${S3_CORS_EXPOSE_HEADERS:-ETag}
      S3_CORS_MAX_AGE_SECONDS: ${S3_CORS_MAX_AGE_SECONDS:-3000}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    depends_on:
      seaweedfs-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U crm -d crm" ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: crm-tools:local
    restart: "no"
    build:
      context: .
      target: runner-tools
    command: [ "node", "node_modules/prisma/build/index.js", "migrate", "deploy" ]
    environment:
      <<: *database-env
    depends_on:
      postgres:
        condition: service_healthy

  bootstrap:
    image: crm-tools:local
    restart: "no"
    build:
      context: .
      target: runner-tools
    command: [ "node", "--import", "tsx", "scripts/bootstrap-admin.ts" ]
    environment:
      <<: [ *database-env, *bootstrap-env ]
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    image: crm-app:local
    build:
      context: .
      target: runner-app
    command: [ "node", "server.js" ]
    environment:
      <<: [ *database-env, *storage-env ]
      AUTH_SECRET: ${AUTH_SECRET:-local-docker-auth-secret-change-me}
      AUTH_URL: ${AUTH_URL:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Sea-Watch CRM}
      CHIBIGEO_SECRET: ${CHIBIGEO_SECRET:-}
      PHOTON_BASE_URL: ${PHOTON_BASE_URL:-https://app.chibigeo.com/v1/photon}
      SMTP_HOST: ${SMTP_HOST:-smtp.example.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-local}
      SMTP_PASS: ${SMTP_PASS:-local}
      SMTP_FROM: ${SMTP_FROM:-noreply@example.com}
      NEXT_AWS_S3_PUBLIC_ENDPOINT: ${NEXT_AWS_S3_PUBLIC_ENDPOINT:-http://localhost:8333}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      seaweedfs-cors:
        condition: service_completed_successfully

  worker:
    image: crm-tools:local
    build:
      context: .
      target: runner-tools
    command: [ "node", "--import", "tsx", "scripts/background-worker.ts" ]
    environment:
      <<: [ *database-env, *storage-env ]
      # Used only as the legacy fallback when INBOUND_EMAIL_ENCRYPTION_KEY is unset.
      AUTH_SECRET: ${AUTH_SECRET:-local-docker-auth-secret-change-me}
      BACKGROUND_WORKER_POLL_INTERVAL_MS: "5000"
      BACKGROUND_WORKER_STALE_LOCK_MS: "3600000"
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      seaweedfs-cors:
        condition: service_completed_successfully

volumes:
  postgres-data:
  seaweedfs-data:
